
name: こんなことを話したい
description: DojoMeetingで他のDojoのメンバーと話したいことを投稿します
title: "話題："
labels: ["theme"]

body:
  - type: markdown
    attributes:
      value: |
        話題の提案ありがとうございます。
        過去に同じ話題が出ていれば、そちらにリアクションするだけでもOKです。
        お気軽にどうぞ！

  - type: textarea
    id: theme
    attributes:
      label: どのようなことを話したいですか
    validations:
      required: true

  - type: textarea
    id: dojo
    attributes:
      label: 参加・運営されているDojoを教えてください。
      placeholder: 奈良（地域名だけでOK、参加されていない方は「なし」と記入してください）
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: CoderDojoでの役割
      options:
        - ニンジャ
        - 保護者
        - メンター
        - チャンピオン（運営者）
        - その他
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 確認
      options:
        - label: 個人を特定する情報などは含まれていません
          required: true
        - label: 特定の個人や組織を批判する内容ではありません
          required: true
